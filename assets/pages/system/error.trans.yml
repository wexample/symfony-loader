en:
  exit: Back to the home page
  code:
    '401':
      title: Please sign in
      message: This page is for signed-in users. Sign in and open it again.
    '403':
      title: This page is not yours to open
      message: Your account does not have access to it. Ask whoever manages the application if you need it.
    '404':
      title: This page does not exist
      message: The address is wrong, or what it pointed to has been removed.
    '500':
      title: Something went wrong
      message: The error has been recorded. Try again in a moment, and tell whoever manages the application if it keeps happening.
    default:
      title: This page cannot be shown
      message: Try again in a moment, and tell whoever manages the application if it keeps happening.

fr:
  exit: Retour à l'accueil
  code:
    '401':
      title: Connectez-vous
      message: Cette page est réservée aux personnes connectées. Connectez-vous, puis ouvrez-la à nouveau.
    '403':
      title: Cette page ne vous est pas ouverte
      message: Votre compte n'y a pas accès. Demandez-le à la personne qui administre l'application si vous en avez besoin.
    '404':
      title: Cette page n'existe pas
      message: L'adresse est erronée, ou ce qu'elle désignait a été supprimé.
    '500':
      title: Une erreur est survenue
      message: L'erreur a été enregistrée. Réessayez dans un instant, et signalez-le si cela se reproduit.
    default:
      title: Cette page ne peut pas être affichée
      message: Réessayez dans un instant, et signalez-le si cela se reproduit.

zh:
  exit: 返回主页
  code:
    401:
      title: 请登录
      message: 此页面仅供已登录用户访问。请登录后再试。
    403:
      title: 您无权打开此页面
      message: 您的账户没有访问权限。如有需要，请联系管理该应用的人。
    404:
      title: 此页面不存在
      message: 地址错误，或所指向的内容已被删除。
    500:
      title: 出现问题
      message: 错误已被记录。请稍后再试，如果问题持续，请告知管理该应用的人。
    default:
      title: 无法显示此页面
      message: 请稍后再试，如果问题持续，请告知管理该应用的人。

ar:
  exit: 'العودة إلى الصفحة الرئيسية'
  code:
    401:
      title: 'يرجى تسجيل الدخول'
      message: 'هذه الصفحة مخصصة للمستخدمين المسجلين. سجل الدخول وافتحها مرة أخرى.'
    403:
      title: 'هذه الصفحة ليست لك لفتحها'
      message: 'حسابك ليس لديه الوصول إليها. اسأل من يدير التطبيق إذا كنت بحاجة إليها.'
    404:
      title: 'هذه الصفحة غير موجودة'
      message: 'العنوان غير صحيح، أو ما كان يشير إليه قد تم حذفه.'
    500:
      title: 'حدث خطأ ما'
      message: 'تم تسجيل الخطأ. حاول مرة أخرى بعد لحظة، وقل لمن يدير التطبيق إذا استمر في الحدوث.'
    default:
      title: 'لا يمكن عرض هذه الصفحة'
      message: 'حاول مرة أخرى بعد لحظة، وقل لمن يدير التطبيق إذا استمر في الحدوث.'
