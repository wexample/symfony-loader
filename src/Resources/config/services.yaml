parameters:
    loader.debug: false
    loader.environment: '%env(APP_ENV)%'
    loader.layout_bases: {}
    
    # Loader colors
    loader.colors: {}

    loader.usages.responsive:
      list:
        xs:
          allow_switch: true
          breakpoint: 0
        s:
          allow_switch: true
          breakpoint: 576
        m:
          allow_switch: true
          breakpoint: 768
        l:
          allow_switch: true
          breakpoint: 992
        xl:
          allow_switch: true
          breakpoint: 1200
        xxl:
          allow_switch: true
          breakpoint: 1400

    # Color schemes
    loader.usages.color_scheme:
      default: default
      list:
        dark:
          allow_switch: false
        default:
          allow_switch: false
        light:
          allow_switch: false

    # Density: how much fits on a screen — spacing, sizes, type scale.
    loader.usages.density:
      default: default
      list:
        default:
          allow_switch: false
        fat:
          allow_switch: false
        slim:
          allow_switch: false

    # Skin: the character, at equal density and light — radii, shadows,
    # borders, separators.
    loader.usages.skin:
      default: basic
      list:
        basic:
          allow_switch: true
        soft:
          allow_switch: true

    # Animations: whether the page moves of its own accord. Only the values a
    # theme ships a file for belong here — a value that loads nothing is a
    # switch that does nothing.
    loader.usages.animations:
      default: none
      list:
        none:
          allow_switch: false

    # Fonts: the faces a page is set in, and the weights it insists with.
    loader.usages.fonts:
      default: system
      list:
        system:
          allow_switch: true
        editorial:
          allow_switch: true
        mono:
          allow_switch: true

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyLoader\Rendering\ComponentManager\:
        resource: '../../Rendering/ComponentManager/*'
        tags:
            - { name: 'symfony_loader.component_manager' }

    Wexample\SymfonyLoader\Rendering\ComponentManagerLocatorService:
        arguments: [!tagged_locator { tag: 'symfony_loader.component_manager' }]

    Wexample\SymfonyLoader\:
        resource: '../../{Command,Controller,EventSubscriber,Service,Twig}'
        exclude:
            - '../../Twig/Node'
            - '../../Twig/TokenParser'
        tags: ['controller.service_arguments']

    Wexample\SymfonyLoader\Twig\ColorExtension:
        arguments:
            $colors: '%loader.colors%'

    Wexample\SymfonyLoader\Service\LayoutService:
        arguments:
            $layoutBases: '%loader.layout_bases%'

    Wexample\SymfonyLoader\Service\DevelopToolbarRegistryService:
        arguments:
            $tabs: !tagged_iterator wexample_symfony_loader.develop_tab
